# AEB TV Dashboard v2.0.0 - TV-first 10-foot HMI
# Native picture-elements + native navigation buttons; no custom card dependency.
title: "AEB — Stato casa"
views:
  - title: "Stato casa"
    path: stato-casa
    icon: mdi:home-monitor
    type: panel
    theme: "AEB TV"
    cards:
      - type: vertical-stack
        cards:
          - type: picture-elements
            image: /local/aeb-tv/home-v2.svg?v=200
            elements:
              - type: state-label
                entity: sensor.aeb_tv_stato_casa
                style:
                  left: 50%
                  top: 6.1%
                  color: "#f4f7fa"
                  font-size: 38px
                  font-weight: 800
                  letter-spacing: 1px
                  pointer-events: none
              - type: state-label
                entity: sensor.aeb_tv_ora
                style:
                  left: 84%
                  top: 6.1%
                  color: "#f4f7fa"
                  font-size: 38px
                  font-weight: 700
                  pointer-events: none
              - type: state-label
                entity: sensor.aeb_tv_temperatura_esterna
                style:
                  left: 93%
                  top: 6.1%
                  color: "#aeb9c6"
                  font-size: 34px
                  font-weight: 700
                  pointer-events: none
              - type: state-label
                entity: sensor.aeb_tv_temperatura_interna
                style:
                  left: 14.6%
                  top: 31.5%
                  color: "#f4f7fa"
                  font-size: 88px
                  font-weight: 800
                  pointer-events: none
              - type: state-label
                entity: sensor.aeb_tv_umidita_interna
                style:
                  left: 38.2%
                  top: 31.5%
                  color: "#f4f7fa"
                  font-size: 88px
                  font-weight: 800
                  pointer-events: none
              - type: state-label
                entity: sensor.aeb_tv_temperatura_esterna
                style:
                  left: 61.8%
                  top: 31.5%
                  color: "#f4f7fa"
                  font-size: 88px
                  font-weight: 800
                  pointer-events: none
              - type: state-label
                entity: sensor.aeb_tv_potenza_fv
                style:
                  left: 85.4%
                  top: 31.5%
                  color: "#ffd166"
                  font-size: 80px
                  font-weight: 800
                  pointer-events: none
              - type: state-label
                entity: sensor.ac_priority
                prefix: "AC  "
                style:
                  left: 6.2%
                  top: 62.5%
                  transform: translate(0,-50%)
                  color: "#f4f7fa"
                  font-size: 34px
                  font-weight: 800
                  pointer-events: none
              - type: state-label
                entity: sensor.heating_priority
                prefix: "RISC  "
                style:
                  left: 6.2%
                  top: 71.5%
                  transform: translate(0,-50%)
                  color: "#aeb9c6"
                  font-size: 28px
                  font-weight: 700
                  pointer-events: none
              - type: state-label
                entity: sensor.ventilation_priority
                style:
                  left: 36.8%
                  top: 62.5%
                  transform: translate(0,-50%)
                  color: "#f4f7fa"
                  font-size: 34px
                  font-weight: 800
                  pointer-events: none
              - type: state-label
                entity: sensor.ventilation_reason
                style:
                  left: 36.8%
                  top: 71.5%
                  transform: translate(0,-50%)
                  color: "#aeb9c6"
                  font-size: 25px
                  font-weight: 600
                  max-width: 490px
                  white-space: nowrap
                  overflow: hidden
                  text-overflow: ellipsis
                  pointer-events: none
              - type: state-label
                entity: sensor.aeb_tv_consumo_casa
                prefix: "CASA  "
                style:
                  left: 67.4%
                  top: 62.5%
                  transform: translate(0,-50%)
                  color: "#f4f7fa"
                  font-size: 34px
                  font-weight: 800
                  pointer-events: none
              - type: state-label
                entity: sensor.aeb_tv_scambio_rete
                style:
                  left: 67.4%
                  top: 71.5%
                  transform: translate(0,-50%)
                  color: "#aeb9c6"
                  font-size: 28px
                  font-weight: 700
                  pointer-events: none
              - type: state-label
                entity: sensor.aeb_tv_avviso_prioritario
                style:
                  left: 50%
                  top: 88.4%
                  color: "#f4f7fa"
                  font-size: 32px
                  font-weight: 800
                  letter-spacing: 1px
                  pointer-events: none
          - type: grid
            columns: 6
            square: false
            cards:
              - type: button
                name: "MENU"
                icon: mdi:view-grid-outline
                tap_action:
                  action: navigate
                  navigation_path: /13-stato-casa-tv/menu
                hold_action:
                  action: none
              - type: button
                name: "CLIMA"
                icon: mdi:snowflake-thermometer
                tap_action:
                  action: navigate
                  navigation_path: /13-stato-casa-tv/clima
                hold_action:
                  action: none
              - type: button
                name: "VMC"
                icon: mdi:fan
                tap_action:
                  action: navigate
                  navigation_path: /13-stato-casa-tv/vmc
                hold_action:
                  action: none
              - type: button
                name: "ENERGIA"
                icon: mdi:solar-power
                tap_action:
                  action: navigate
                  navigation_path: /13-stato-casa-tv/energia
                hold_action:
                  action: none
              - type: button
                name: "ACS"
                icon: mdi:water-boiler
                tap_action:
                  action: navigate
                  navigation_path: /13-stato-casa-tv/acs
                hold_action:
                  action: none
              - type: button
                name: "AZIONI"
                icon: mdi:gesture-tap-button
                tap_action:
                  action: navigate
                  navigation_path: /13-stato-casa-tv/azioni
                hold_action:
                  action: none

  - title: "Clima"
