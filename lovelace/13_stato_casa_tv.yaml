            entity: sensor.ur_in_media
            name: "Umidità interna"
            vertical: true
            tap_action:
              action: none
          - type: tile
            entity: sensor.t_out_effective
            name: "Temperatura esterna"
            vertical: true
            tap_action:
              action: none
