title: "8 Mirai"
views:
  - title: "8 MIRAI Plant"
    path: 8-mirai
    icon: mdi:heat-pump
    type: sections
    max_columns: 2

    sections:
      - type: grid
        title: "Runtime macchina"
        cards:
          - type: button
            name: "Torna a ECLSS Casa"
            icon: mdi:arrow-left
            tap_action:
              action: navigate
              navigation_path: /01-clima-casa/climate_casa
          - type: markdown
            title: "Ruolo plancia"
            content: |-
              Questa plancia e` il **drill-down macchina MIRAI**.

              Usa `9 Fieldbus` solo per raw bus / forensic basso livello.
          - type: button
            name: "Apri Fieldbus MIRAI"
            icon: mdi:transit-connection-variant
            tap_action:
              action: navigate
              navigation_path: /09-modbus/modbus-mirai
          - type: entities
            title: "Stato macchina"
            show_header_toggle: false
            entities:
              - binary_sensor.mirai_machine_running
              - sensor.mirai_machine_state
              - sensor.mirai_machine_running_source
              - sensor.mirai_power_w
              - binary_sensor.cm_modbus_mirai_ready
              - binary_sensor.cm_modbus_mirai_posture_ok
              - sensor.cm_modbus_mirai_reason
              - binary_sensor.mirai_manual_unit_profile_ok
          - type: entities
            title: "Corroborazione"
            show_header_toggle: false
            entities:
              - binary_sensor.mirai_machine_running_by_power
              - binary_sensor.mirai_pump_candidate_running
              - sensor.mirai_status_word_effective
              - sensor.mirai_status_code_effective
              - sensor.mirai_fault_code_effective
              - input_number.mirai_running_power_on_w

      - type: grid
        title: "Diagnostica"
        cards:
          - type: entities
            title: "Diagnostica rapida"
            show_header_toggle: false
            entities:
              - binary_sensor.cm_modbus_mirai_ready
              - binary_sensor.cm_modbus_mirai_expected_ready
              - binary_sensor.cm_modbus_mirai_posture_ok
              - sensor.cm_modbus_mirai_reason
              - sensor.mirai_machine_running_source
              - binary_sensor.mirai_machine_running
              - binary_sensor.mirai_manual_unit_profile_ok
              - sensor.mirai_machine_state
              - sensor.mirai_status_word_effective
              - sensor.mirai_status_code_effective
              - sensor.mirai_fault_code_effective
              - sensor.mirai_power_w
              - sensor.mirai_u1_status_word_raw
              - sensor.mirai_u1_status_code_raw
              - sensor.mirai_u1_fault_code_raw
              - sensor.mirai_status_bits_on
              - input_boolean.mirai_debug_enable
          - type: entities
            title: "Runtime truth closure"
            show_header_toggle: false
            entities:
              - binary_sensor.mirai_runtime_truth_inputs_ready
              - binary_sensor.mirai_runtime_truth_run_window_candidate
              - binary_sensor.mirai_runtime_truth_modbus_run_confirmed
              - binary_sensor.mirai_runtime_truth_pump_corroborated
              - binary_sensor.mirai_runtime_truth_coherent_run
              - sensor.mirai_runtime_truth_score
              - sensor.mirai_runtime_truth_reason
              - sensor.mirai_runtime_truth_run_window_hours_today
              - sensor.mirai_runtime_truth_coherent_run_hours_today
              - input_number.mirai_runtime_truth_min_run_w

      - type: grid
        title: "History 24h"
        cards:
          - type: history-graph
            hours_to_show: 24
            refresh_interval: 120
            entities:
              - binary_sensor.mirai_machine_running
              - binary_sensor.mirai_machine_running_by_power
              - sensor.mirai_power_w
              - sensor.mirai_status_word_effective
              - sensor.mirai_status_code_effective
              - sensor.mirai_fault_code_effective
