###############################################################################
# PACKAGE: ehw_shadow_policy.yaml
# AEB-DHW-001 / M63
# Read-only ACS/EHW policy evaluation. This package contains no service calls,
# automations or Modbus writes.
###############################################################################

input_boolean:
  ehw_shadow_enabled:
    name: "EHW shadow policy enabled"
    icon: mdi:eye-outline
    initial: false
  ehw_shadow_limits_verified:
    name: "EHW shadow limits verified"
    icon: mdi:thermometer-check
    # Shadow-only bounds 45/50/55 degC approved by the owner on 2026-09-24.
    initial: true
  ehw_shadow_legionella_verified:
    name: "EHW shadow legionella authority verified"
    icon: mdi:shield-check-outline
    initial: false
  ehw_shadow_manual_override:
    name: "EHW shadow manual override"
    icon: mdi:hand-back-right-outline
    initial: false
  ehw_shadow_legionella_active:
    name: "EHW shadow legionella cycle active"
    icon: mdi:bacteria-outline
    initial: false

input_number:
  ehw_shadow_min_comfort_c:
    name: "EHW shadow minimum comfort"
    min: 10
    max: 60
    step: 0.5
    unit_of_measurement: "degC"
    mode: box
    initial: 45
  ehw_shadow_normal_target_c:
    name: "EHW shadow normal target"
    min: 10
    max: 60
    step: 0.5
    unit_of_measurement: "degC"
    mode: box
    initial: 50
  ehw_shadow_preheat_target_c:
    name: "EHW shadow preheat target"
    min: 10
    max: 60
    step: 0.5
    unit_of_measurement: "degC"
    mode: box
    initial: 55
  ehw_shadow_freshness_max_s:
    name: "EHW shadow maximum input age"
    min: 30
    max: 1800
    step: 30
    unit_of_measurement: "s"
    mode: box
    # EHW Modbus telemetry is polled every 180 s. Allow one poll plus jitter.
    initial: 300

template:
  - binary_sensor:
      - name: "EHW shadow preheat eligible"
        unique_id: ehw_shadow_preheat_eligible
        icon: mdi:solar-power-variant-outline
        delay_on: "00:05:00"
        delay_off: "00:05:00"
        availability: >-
          {{
            states('binary_sensor.policy_surplus_ok') in ['on', 'off']
            and has_value('sensor.grid_direction')
            and has_value('sensor.grid_power_w')
          }}
        state: >-
          {% set max_age = states('input_number.ehw_shadow_freshness_max_s') | float(180) %}
          {% set grid = states.sensor.grid_power_w %}
          {% set direction = states.sensor.grid_direction %}
          {% set grid_ts = grid.last_reported | default(grid.last_updated, true) if grid is not none else none %}
          {% set direction_ts = direction.last_reported | default(direction.last_updated, true) if direction is not none else none %}
          {% set grid_age = (as_timestamp(now()) - as_timestamp(grid_ts)) if grid_ts is not none else 999999 %}
          {% set direction_age = (as_timestamp(now()) - as_timestamp(direction_ts)) if direction_ts is not none else 999999 %}
          {% set direction_value = states('sensor.grid_direction') | lower %}
          {{
            grid_age <= max_age
            and direction_age <= max_age
            and is_state('binary_sensor.policy_surplus_ok', 'on')
            and direction_value in ['export', 'exporting', 'immissione', 'immettendo', 'to_grid', 'reverse']
            and (states('sensor.grid_power_w') | float(0) | abs) > 0
          }}

  - trigger:
      - platform: homeassistant
        event: start
      - platform: time_pattern
        minutes: "/1"
      - platform: state
        entity_id:
          - input_boolean.ehw_shadow_enabled
          - input_boolean.ehw_shadow_limits_verified
          - input_boolean.ehw_shadow_legionella_verified
          - input_boolean.ehw_shadow_manual_override
          - input_boolean.ehw_shadow_legionella_active
          - input_number.ehw_shadow_min_comfort_c
          - input_number.ehw_shadow_normal_target_c
          - input_number.ehw_shadow_preheat_target_c
          - input_number.ehw_shadow_freshness_max_s
          - binary_sensor.cm_modbus_ehw_ready
          - binary_sensor.ehw_shadow_preheat_eligible
          - binary_sensor.policy_surplus_ok
          - sensor.ehw_tank_top
          - sensor.ehw_tank_bottom
          - sensor.ehw_setpoint
          - sensor.grid_direction
          - sensor.grid_power_w
    sensor:
      - name: "EHW shadow action"
        unique_id: ehw_shadow_action
        icon: mdi:state-machine
        state: >-
          {% set max_age = states('input_number.ehw_shadow_freshness_max_s') | float(180) %}
          {% set top = states.sensor.ehw_tank_top %}
          {% set bottom = states.sensor.ehw_tank_bottom %}
          {% set sp = states.sensor.ehw_setpoint %}
          {% set top_age = (as_timestamp(now()) - as_timestamp(top.last_reported | default(top.last_updated, true))) if top is not none else 999999 %}
          {% set bottom_age = (as_timestamp(now()) - as_timestamp(bottom.last_reported | default(bottom.last_updated, true))) if bottom is not none else 999999 %}
          {% set sp_age = (as_timestamp(now()) - as_timestamp(sp.last_reported | default(sp.last_updated, true))) if sp is not none else 999999 %}
          {% set ehw_missing = not has_value('sensor.ehw_tank_top') or not has_value('sensor.ehw_tank_bottom') or not has_value('sensor.ehw_setpoint') %}
          {% set ehw_stale = top_age > max_age or bottom_age > max_age or sp_age > max_age %}
          {% set top_c = states('sensor.ehw_tank_top') | float(default=none) %}
          {% set min_c = states('input_number.ehw_shadow_min_comfort_c') | float(45) %}
          {% if not is_state('input_boolean.ehw_shadow_enabled', 'on') %}BLOCK
          {% elif not is_state('input_boolean.ehw_shadow_limits_verified', 'on') %}BLOCK
          {% elif is_state('input_boolean.ehw_shadow_manual_override', 'on') %}HOLD
          {% elif is_state('input_boolean.ehw_shadow_legionella_active', 'on') %}HOLD
          {% elif not is_state('binary_sensor.cm_modbus_ehw_ready', 'on') %}BLOCK
          {% elif ehw_missing or ehw_stale %}BLOCK
          {% elif top_c is number and top_c < min_c %}COMFORT_RECOVERY
          {% elif is_state('binary_sensor.ehw_shadow_preheat_eligible', 'on') %}PREHEAT
          {% else %}MAINTAIN
          {% endif %}
        attributes:
          shadow_only: true
          write_authority: none
          tank_top_c: "{{ states('sensor.ehw_tank_top') }}"
          tank_bottom_c: "{{ states('sensor.ehw_tank_bottom') }}"
          actual_setpoint_c: "{{ states('sensor.ehw_setpoint') }}"
          grid_power_w: "{{ states('sensor.grid_power_w') }}"
          grid_direction: "{{ states('sensor.grid_direction') }}"
          surplus_ok: "{{ states('binary_sensor.policy_surplus_ok') }}"
          min_comfort_c: "{{ states('input_number.ehw_shadow_min_comfort_c') }}"
          normal_target_c: "{{ states('input_number.ehw_shadow_normal_target_c') }}"
          preheat_target_c: "{{ states('input_number.ehw_shadow_preheat_target_c') }}"
          legionella_authority_verified: "{{ states('input_boolean.ehw_shadow_legionella_verified') }}"

      - name: "EHW shadow reason code"
        unique_id: ehw_shadow_reason_code
        icon: mdi:code-tags
        state: >-
          {% set max_age = states('input_number.ehw_shadow_freshness_max_s') | float(180) %}
          {% set top = states.sensor.ehw_tank_top %}
          {% set bottom = states.sensor.ehw_tank_bottom %}
          {% set sp = states.sensor.ehw_setpoint %}
          {% set grid = states.sensor.grid_power_w %}
          {% set direction = states.sensor.grid_direction %}
          {% set top_age = (as_timestamp(now()) - as_timestamp(top.last_reported | default(top.last_updated, true))) if top is not none else 999999 %}
          {% set bottom_age = (as_timestamp(now()) - as_timestamp(bottom.last_reported | default(bottom.last_updated, true))) if bottom is not none else 999999 %}
          {% set sp_age = (as_timestamp(now()) - as_timestamp(sp.last_reported | default(sp.last_updated, true))) if sp is not none else 999999 %}
          {% set grid_age = (as_timestamp(now()) - as_timestamp(grid.last_reported | default(grid.last_updated, true))) if grid is not none else 999999 %}
          {% set direction_age = (as_timestamp(now()) - as_timestamp(direction.last_reported | default(direction.last_updated, true))) if direction is not none else 999999 %}
          {% set ehw_missing = not has_value('sensor.ehw_tank_top') or not has_value('sensor.ehw_tank_bottom') or not has_value('sensor.ehw_setpoint') %}
          {% set ehw_stale = top_age > max_age or bottom_age > max_age or sp_age > max_age %}
          {% set top_c = states('sensor.ehw_tank_top') | float(default=none) %}
          {% set min_c = states('input_number.ehw_shadow_min_comfort_c') | float(45) %}
          {% if not is_state('input_boolean.ehw_shadow_enabled', 'on') %}SHADOW_DISABLED
          {% elif not is_state('input_boolean.ehw_shadow_limits_verified', 'on') %}BLOCK_LIMITS_UNVERIFIED
          {% elif is_state('input_boolean.ehw_shadow_manual_override', 'on') %}HOLD_MANUAL_OVERRIDE
          {% elif is_state('input_boolean.ehw_shadow_legionella_active', 'on') %}HOLD_LEGIONELLA_PASS_THROUGH
          {% elif not is_state('binary_sensor.cm_modbus_ehw_ready', 'on') %}BLOCK_MODBUS_NOT_READY
          {% elif ehw_missing %}BLOCK_EHW_DATA_MISSING
          {% elif ehw_stale %}BLOCK_EHW_DATA_STALE
          {% elif top_c is number and top_c < min_c %}RECOVER_COMFORT_LOW_TOP_TEMP
          {% elif is_state('binary_sensor.ehw_shadow_preheat_eligible', 'on') %}PREHEAT_STABLE_GRID_EXPORT
          {% elif not has_value('sensor.grid_power_w') or not has_value('sensor.grid_direction') %}HOLD_ENERGY_DATA_MISSING
          {% elif grid_age > max_age or direction_age > max_age %}HOLD_ENERGY_DATA_STALE
          {% elif (states('sensor.grid_direction') | lower) in ['import', 'importing', 'prelievo', 'prelevando', 'from_grid', 'forward'] %}HOLD_GRID_IMPORTING
          {% elif not is_state('binary_sensor.policy_surplus_ok', 'on') %}HOLD_NO_SURPLUS
          {% else %}HOLD_AT_CURRENT_TARGET
          {% endif %}

      - name: "EHW shadow proposed target"
        unique_id: ehw_shadow_proposed_target
        device_class: temperature
        state_class: measurement
        unit_of_measurement: "degC"
        availability: >-
          {{ states('sensor.ehw_shadow_action') not in ['unknown', 'unavailable', 'BLOCK'] }}
        state: >-
          {% set action = states('sensor.ehw_shadow_action') %}
          {% if action == 'COMFORT_RECOVERY' %}
            {{ states('input_number.ehw_shadow_normal_target_c') | float(50) }}
          {% elif action == 'PREHEAT' %}
            {{ states('input_number.ehw_shadow_preheat_target_c') | float(55) }}
          {% else %}
            {{ states('sensor.ehw_setpoint') | float(default=none) }}
          {% endif %}

      - name: "EHW shadow data quality"
        unique_id: ehw_shadow_data_quality
        icon: mdi:database-check-outline
        state: >-
          {% set max_age = states('input_number.ehw_shadow_freshness_max_s') | float(180) %}
          {% set top = states.sensor.ehw_tank_top %}
          {% set bottom = states.sensor.ehw_tank_bottom %}
          {% set sp = states.sensor.ehw_setpoint %}
          {% set grid = states.sensor.grid_power_w %}
          {% set direction = states.sensor.grid_direction %}
          {% set top_age = (as_timestamp(now()) - as_timestamp(top.last_reported | default(top.last_updated, true))) if top is not none else 999999 %}
          {% set bottom_age = (as_timestamp(now()) - as_timestamp(bottom.last_reported | default(bottom.last_updated, true))) if bottom is not none else 999999 %}
          {% set sp_age = (as_timestamp(now()) - as_timestamp(sp.last_reported | default(sp.last_updated, true))) if sp is not none else 999999 %}
          {% set grid_age = (as_timestamp(now()) - as_timestamp(grid.last_reported | default(grid.last_updated, true))) if grid is not none else 999999 %}
          {% set direction_age = (as_timestamp(now()) - as_timestamp(direction.last_reported | default(direction.last_updated, true))) if direction is not none else 999999 %}
          {% if not is_state('input_boolean.ehw_shadow_limits_verified', 'on') %}
            UNVERIFIED
          {% elif not has_value('sensor.ehw_tank_top') or not has_value('sensor.ehw_tank_bottom') or not has_value('sensor.ehw_setpoint') or top_age > max_age or bottom_age > max_age or sp_age > max_age %}
            EHW_STALE
          {% elif not has_value('sensor.grid_power_w') or not has_value('sensor.grid_direction') or grid_age > max_age or direction_age > max_age %}
            ENERGY_STALE
          {% else %}
            READY
          {% endif %}
        attributes:
          max_age_s: "{{ states('input_number.ehw_shadow_freshness_max_s') }}"
          tank_top_age_s: >-
            {% set s = states.sensor.ehw_tank_top %}
            {{ ((as_timestamp(now()) - as_timestamp(s.last_reported | default(s.last_updated, true))) | round(0)) if s is not none else none }}
          tank_bottom_age_s: >-
            {% set s = states.sensor.ehw_tank_bottom %}
            {{ ((as_timestamp(now()) - as_timestamp(s.last_reported | default(s.last_updated, true))) | round(0)) if s is not none else none }}
          setpoint_age_s: >-
            {% set s = states.sensor.ehw_setpoint %}
            {{ ((as_timestamp(now()) - as_timestamp(s.last_reported | default(s.last_updated, true))) | round(0)) if s is not none else none }}
          grid_power_age_s: >-
            {% set s = states.sensor.grid_power_w %}
            {{ ((as_timestamp(now()) - as_timestamp(s.last_reported | default(s.last_updated, true))) | round(0)) if s is not none else none }}
          grid_direction_age_s: >-
            {% set s = states.sensor.grid_direction %}
            {{ ((as_timestamp(now()) - as_timestamp(s.last_reported | default(s.last_updated, true))) | round(0)) if s is not none else none }}
