# AC observability extracted from legacy AC logic package.
# Purpose: keep counters and history/statistics sensors separate from control logic.
---
counter:
  ac_churn_suppressed:
    name: "AC churn suppressed"
    icon: mdi:shield-sync
    initial: 0
    step: 1

# Measurement confirmation is branch-level.  The SDM120 CH3 meter is shared by
# both AC units, so it can confirm the branch but cannot attribute compressor
# activity to day or night.  The thresholds below are calibrated from the
# Recorder evidence documented in docs/audits/AC_DIAGNOSTIC_2026-09-23.md.
input_boolean:
  ac_power_confirmation_enabled:
    name: "AC power confirmation enabled"
    icon: mdi:flash-check-outline
    initial: true

input_number:
  ac_power_confirm_on_w:
    name: "AC power confirmation ON threshold"
    min: 0
    max: 5000
    step: 1
    initial: 80
    unit_of_measurement: "W"
    mode: box
  ac_power_confirm_off_w:
    name: "AC power confirmation OFF threshold"
    min: 0
    max: 5000
    step: 1
    initial: 30
    unit_of_measurement: "W"
    mode: box

template:
  - binary_sensor:
      - name: "AC branch power confirmed"
        unique_id: ac_branch_power_confirmed
        default_entity_id: binary_sensor.ac_branch_power_confirmed
        device_class: running
        state: >-
          {% set p = states('sensor.ac_power_w') | float(default=none) %}
          {% set on_w = states('input_number.ac_power_confirm_on_w') | float(0) %}
          {% set off_w = states('input_number.ac_power_confirm_off_w') | float(0) %}
          {% set was_on = this.state == 'on' %}
          {{
            p is number
            and on_w > off_w
            and (p >= on_w or (was_on and p >= off_w))
          }}
        availability: >-
          {{
            is_state('input_boolean.ac_power_confirmation_enabled','on')
            and states('sensor.ac_power_w') not in ['unknown','unavailable','']
            and states('input_number.ac_power_confirm_on_w') | float(0) > 0
            and states('input_number.ac_power_confirm_off_w') | float(0) >= 0
          }}
        delay_on: "00:01:00"
        delay_off: "00:01:00"

sensor:
  - platform: template
    sensors:
      ac_branch_operating_state:
        friendly_name: "AC branch operating state"
        value_template: >-
          {% set p = states('sensor.ac_power_w') | float(default=none) %}
          {% set on_w = states('input_number.ac_power_confirm_on_w') | float(0) %}
          {% set off_w = states('input_number.ac_power_confirm_off_w') | float(0) %}
          {% set enabled = is_state('input_boolean.ac_power_confirmation_enabled','on') %}
          {% if not enabled or on_w <= 0 or off_w <= 0 or on_w <= off_w %}
            calibration_required
          {% elif p is not number %}
            unknown
          {% elif is_state('binary_sensor.ac_branch_power_confirmed','on') %}
            confirmed_on
          {% elif p <= off_w %}
            off
          {% else %}
            indeterminate_hysteresis_band
          {% endif %}
        icon_template: mdi:air-conditioner
        attribute_templates:
          measurement_entity: sensor.ac_power_w
          measurement_scope: "shared AC branch; not unit-specific"
          confirmation_delay: "1 minute; two approximately 30 s samples"
          confirmation_on_w: "{{ states('input_number.ac_power_confirm_on_w') }}"
          confirmation_off_w: "{{ states('input_number.ac_power_confirm_off_w') }}"
          confirmation_enabled: "{{ states('input_boolean.ac_power_confirmation_enabled') }}"

      ac_giorno_operating_state:
        friendly_name: "AC giorno operating state"
        value_template: >-
          {% set branch = states('sensor.ac_branch_operating_state') %}
          {% if branch == 'unknown' %}
            unknown
          {% elif branch == 'calibration_required' %}
            calibration_required
          {% elif states('switch.ac_giorno') in ['unknown','unavailable'] %}
            unknown
          {% elif is_state('switch.ac_giorno','off') %}
            off
          {% elif branch == 'confirmed_on' and is_state('switch.ac_notte','off') %}
            confirmed_branch_only_not_unit
          {% elif branch == 'confirmed_on' %}
            confirmed_shared_branch_not_unit
          {% else %}
            request_not_confirmed
          {% endif %}
        icon_template: mdi:air-conditioner

      ac_notte_operating_state:
        friendly_name: "AC notte operating state"
        value_template: >-
          {% set branch = states('sensor.ac_branch_operating_state') %}
          {% if branch == 'unknown' %}
            unknown
          {% elif branch == 'calibration_required' %}
            calibration_required
          {% elif states('switch.ac_notte') in ['unknown','unavailable'] %}
            unknown
          {% elif is_state('switch.ac_notte','off') %}
            off
          {% elif branch == 'confirmed_on' and is_state('switch.ac_giorno','off') %}
            confirmed_branch_only_not_unit
          {% elif branch == 'confirmed_on' %}
            confirmed_shared_branch_not_unit
          {% else %}
            request_not_confirmed
          {% endif %}
        icon_template: mdi:air-conditioner

  - platform: statistics
    name: t_out_effective_mean_24h
    entity_id: sensor.t_out_effective
    state_characteristic: mean
    sampling_size: 500
    max_age:
      hours: 24

  - platform: statistics
    name: t_out_effective_mean_96h
    entity_id: sensor.t_out_effective
    state_characteristic: mean
    sampling_size: 1000
    max_age:
      hours: 96

  - platform: history_stats
    name: "AC Season Request Hours 24h"
    unique_id: ac_season_request_hours_24h
    entity_id: binary_sensor.climateops_request_cool
    state: "on"
    type: time
    start: "{{ now() - timedelta(hours=24) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "AC Giorno – Tempo ON oggi"
    unique_id: ac_giorno_tempo_on_oggi
    entity_id: binary_sensor.cm_driver_ac_giorno_is_on
    state: "on"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "AC Giorno – Cicli ON oggi"
    unique_id: ac_giorno_cicli_on_oggi
    entity_id: binary_sensor.cm_driver_ac_giorno_is_on
    state: "on"
    type: count
    start: "{{ today_at() }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "AC Notte – Tempo ON oggi"
    unique_id: ac_notte_tempo_on_oggi
    entity_id: binary_sensor.cm_driver_ac_notte_is_on
    state: "on"
    type: time
    start: "{{ today_at() }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "AC Notte – Cicli ON oggi"
    unique_id: ac_notte_cicli_on_oggi
    entity_id: binary_sensor.cm_driver_ac_notte_is_on
    state: "on"
    type: count
    start: "{{ today_at() }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "AC – UR fuori banda ore 24h"
    unique_id: ac_ur_out_of_band_hours_24h
    entity_id: binary_sensor.ac_ur_out_of_comfort_band
    state: "on"
    type: time
    start: "{{ now() - timedelta(hours=24) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "AC – Dew point alto ore 24h"
    unique_id: ac_dew_point_high_hours_24h
    entity_id: binary_sensor.ac_dew_point_high
    state: "on"
    type: time
    start: "{{ now() - timedelta(hours=24) }}"
    end: "{{ now() }}"

  - platform: history_stats
    name: "AC – Mismatch giorno/notte ore 24h"
    unique_id: ac_day_night_target_mismatch_hours_24h
    entity_id: binary_sensor.ac_day_night_target_mismatch
    state: "on"
    type: time
    start: "{{ now() - timedelta(hours=24) }}"
    end: "{{ now() }}"

